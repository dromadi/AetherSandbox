name: Android device tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: true
jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Reserve disk space for Android images
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h /
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
