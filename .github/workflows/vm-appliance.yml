name: Android guest appliance
on:
  pull_request:
    paths:
      - 'app/**'
      - 'domain/**'
      - 'tools/vm/engine-lock.json'
      - 'tools/vm/install-engine-artifacts.py'
      - 'tools/vm/prepare-android9.sh'
      - '.github/scripts/engine-device-tests.sh'
      - '.github/workflows/vm-appliance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vm-appliance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build/engine-dependency-source
          docker run --rm -v "$PWD/tools/vm:/scripts:ro" -v "$PWD/build/engine-dependency-source:/out" alpine:3.22 sh /scripts/collect-engine-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vm-engine-dependency-sources
          path: build/engine-dependency-source/
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: build/vm-lab/Image
          key: vm-linux-fixture-v1-${{ hashFiles('tools/vm/build-kernel.sh', 'tools/vm/init.c') }}
      - name: Stage pinned source-built engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/vm/install-engine-artifacts.py
      - name: Kernel and Android toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross flex bison bc libssl-dev libelf-dev
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Build Linux fixture and stage assets
        run: |
          if [ ! -f build/vm-lab/Image ]; then bash tools/vm/build-kernel.sh; fi
          cp build/vm-lab/Image app/build/generated/vmEngineAssets/vm-linux-Image
          bash .github/scripts/prepare-real-apk.sh
      - name: Compile and verify packaged engine APK
        run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AetherSandbox-0.1.0-alpha.13-engine
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
  device:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AetherSandbox-0.1.0-alpha.13-engine
          path: app/build/outputs/apk
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Reserve image space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare upstream Android 9 ISO (test-only)
        if: matrix.api == 34
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          bash tools/vm/prepare-android9.sh
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          VM_FULL_GUEST: ${{ matrix.api == 34 && '1' || '0' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash .github/scripts/engine-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-engine-device-api-${{ matrix.api }}
          path: build/engine-device-evidence/
